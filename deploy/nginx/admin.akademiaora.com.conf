# ===========================================================================
# nginx site for admin.akademiaora.com
#
# Cloudflare (orange-cloud / proxied) terminates TLS for browsers and connects
# to this origin over HTTPS using a Cloudflare ORIGIN certificate. Set the
# Cloudflare SSL/TLS mode to "Full (strict)".
#
# Install:
#   sudo cp deploy/nginx/admin.akademiaora.com.conf \
#           /etc/nginx/sites-available/admin.akademiaora.com.conf
#   sudo ln -s /etc/nginx/sites-available/admin.akademiaora.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust the two ssl_* paths to where you saved the Cloudflare Origin cert.
# ===========================================================================

# Redirect plain HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.akademiaora.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.akademiaora.com;

    # --- Cloudflare Origin certificate -------------------------------------
    # Generate in Cloudflare: SSL/TLS -> Origin Server -> Create Certificate.
    # A wildcard (*.akademiaora.com) origin cert covers this subdomain too.
    ssl_certificate     /etc/ssl/cloudflare/akademiaora.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/akademiaora.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Allow file imports / PDF exports through the proxy.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;   # match APP_PORT in .env.production

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # tells NextAuth it's secure
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / HMR upgrade support (harmless in prod).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
    }
}
